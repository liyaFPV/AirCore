[env:esp32-c3-devkitm-devbuild]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_type = debug
build_flags = 
	-DDEVBUILD
	-D CORE_DEBUG_LEVEL=5
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
lib_deps = 
	gyverlibs/GyverIO@^1.3.14
	gyverlibs/uButton@^1.1.2
	zinggjm/GxEPD2@^1.6.7
	olikraus/U8g2_for_Adafruit_GFX@^1.8.0
	bblanchon/ArduinoJson@^7.2.2
	gyverlibs/GyverNTP@^2.3.1
	gyverlibs/Stamp@^1.5.0
	fastled/FastLED@^3.10.5
	wifwaf/MH-Z19@^1.5.4

[env:esp32-c3-devkitm-release]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_type = release
build_flags = 
	-D CORE_DEBUG_LEVEL=0
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1
lib_deps = 
	gyverlibs/GyverIO@^1.3.14
	gyverlibs/uButton@^1.1.2
	zinggjm/GxEPD2@^1.6.7
	olikraus/U8g2_for_Adafruit_GFX@^1.8.0
	bblanchon/ArduinoJson@^7.2.2
	gyverlibs/GyverNTP@^2.3.1
	gyverlibs/Stamp@^1.5.0
	fastled/FastLED@^3.10.5
	wifwaf/MH-Z19@^1.5.4